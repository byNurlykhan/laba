<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2563EB;--blue-dark:#1D4ED8;--blue-900:#1E3A8A;
  --ink:#0F172A;--text:#475569;--muted:#64748B;
  --surface:#F8FAFC;--line:#E2E8F0;--green:#16A34A;--red:#DC2626;--amber:#D97706;
  --shadow:0 8px 30px rgba(37,99,235,.08);
  --shadow-mid:0 14px 44px rgba(37,99,235,.12);
  --sidebar:264px;
  /* күн режимі */
  --page:#F8FAFC;--card:#fff;--soft:var(--soft);--soft2:#DBEAFE;--soft-line:var(--soft-line);--faint:var(--faint);
  --track:#E2E8F0;--topbar:rgba(255,255,255,.9);--note-ink:#1E40AF;--map-lo:#DBEAFE;--map-hi:#1D4ED8;
  color-scheme:light;
}
/* түн режимі */
:root[data-theme="dark"]{
  --blue:#3B82F6;--blue-dark:#2563EB;
  --ink:#E6EDF7;--text:#B3BFD1;--muted:#8794AA;
  --surface:#18233A;--line:#24314A;--green:#22C55E;--red:#F87171;--amber:#FBBF24;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --shadow-mid:0 14px 44px rgba(0,0,0,.45);
  --page:#0B1120;--card:#111A2C;--soft:rgba(59,130,246,.14);--soft2:rgba(59,130,246,.28);--soft-line:rgba(96,165,250,.38);
  --faint:#3A4860;--track:#24314A;--topbar:rgba(11,17,32,.86);--note-ink:#93C5FD;--map-lo:#1A2B4D;--map-hi:#3B82F6;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);
  background:var(--page);line-height:1.6;-webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
h1,h2,h3,h4,h5{color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:1.2}
a{color:inherit}
.accent{color:var(--blue)}
::selection{background:var(--soft2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--card);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;
  transition:transform .25s ease;
}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.sb-logo{display:block;width:100%;max-width:210px;line-height:0;transition:opacity .2s ease}
.sb-logo:hover{opacity:.82}
.sb-logo img{width:100%;height:auto;display:block}
.sb-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.01em;line-height:1.35}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px 20px}
.sb-group{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 7px}
.sb-nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:var(--text);text-decoration:none;transition:all .15s ease;
}
.sb-nav a:hover{background:var(--surface);color:var(--ink)}
.sb-nav a.on{background:var(--soft);color:var(--blue);font-weight:600;box-shadow:inset 0 0 0 1px rgba(37,99,235,.3)}
.sb-nav a .n{width:20px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.sb-nav a.on .n{color:var(--blue)}
.sb-foot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;display:none}
.scrim.on{display:block}

/* ============ MAIN ============ */
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--topbar);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;place-items:center;flex-shrink:0}
.burger span{display:block;width:17px;height:2px;background:var(--ink);border-radius:2px;position:relative}
.burger span::before,.burger span::after{content:'';position:absolute;left:0;width:17px;height:2px;background:var(--ink);border-radius:2px}
.burger span::before{top:-5px}.burger span::after{top:5px}
.crumb{font-size:13px;color:var(--muted);font-weight:500;flex:1;min-width:120px}
.crumb b{color:var(--ink);font-weight:600}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.pick{
  font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;transition:all .2s ease;
}
select.pick:hover{border-color:var(--faint)}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.langs button{
  font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px;
  border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;
}
.langs button.on{background:var(--blue);color:#fff}
.content{padding:28px;max-width:1440px;width:100%}

/* ============ PAGE ============ */
.page{display:none;animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{margin-bottom:22px}
.ph .eyebrow{font-size:11.5px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.ph h1{font-size:clamp(24px,3vw,32px)}
.ph h2{font-size:clamp(21px,2.6vw,27px)}
.ph p{margin-top:9px;font-size:15px;max-width:760px}

/* ============ CARDS ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;transition:box-shadow .2s ease,transform .2s ease}
.card.hov:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .lbl{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.kpi .ic{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.kpi .ic svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .num{font-size:clamp(24px,2.6vw,30px);font-weight:700;color:var(--ink);letter-spacing:-.035em;line-height:1.1}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.delta{font-size:12.5px;font-weight:600;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}

/* chart panel */
.panel-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-hd h3{font-size:16px;font-weight:600;letter-spacing:-.015em}
.panel-hd p{font-size:12.5px;color:var(--muted);margin-top:3px}
.dl{
  width:31px;height:31px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);flex-shrink:0;transition:all .2s ease;
}
.dl:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.dl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbox{position:relative;height:280px}
.cbox.sm{height:210px}
.cbox.lg{height:340px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;max-width:100%}
.tabs button{
  font-family:inherit;font-size:13px;font-weight:500;padding:8px 15px;border-radius:8px;
  border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;white-space:nowrap;
}
.tabs button:hover{color:var(--ink);background:var(--surface)}
.tabs button.on{background:var(--blue);color:#fff;font-weight:600}
.tabpane{display:none}.tabpane.on{display:block}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:0 12px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface)}
.tbl td.v{font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.rank{width:38px}
.medal{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--faint)}
.m1{background:linear-gradient(135deg,#FBBF24,#D97706)}
.m2{background:linear-gradient(135deg,#CBD5E1,#94A3B8)}
.m3{background:linear-gradient(135deg,#FDBA74,#C2410C)}
.scroll-x{overflow-x:auto}

/* bars / progress */
.bar-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.bar-row .nm{font-size:13px;color:var(--text);width:140px;flex-shrink:0}
.bar-track{flex:1;height:9px;background:var(--surface);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:5px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-row .vv{font-size:13px;font-weight:600;color:var(--ink);width:64px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* pill / badge */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--blue)}
.pill.ok{background:#DCFCE7;color:#15803D}
.pill.warn{background:#FEF3C7;color:#B45309}
.pill.bad{background:#FEE2E2;color:#B91C1C}
.pill.gray{background:var(--surface);color:var(--muted)}

/* hero (home) */
.hero{
  background:linear-gradient(135deg,var(--blue),var(--blue-900));border-radius:20px;
  padding:clamp(28px,4vw,44px);color:#fff;margin-bottom:20px;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07);top:-140px;right:-90px}
.hero .tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:18px}
.hero h1{color:#fff;font-size:clamp(26px,3.8vw,40px);position:relative}
.hero p{color:rgba(255,255,255,.84);font-size:15.5px;max-width:660px;margin-top:12px;position:relative}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;position:relative}
.hero-stats div b{display:block;font-size:clamp(20px,2.4vw,26px);font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1.1}
.hero-stats div span{font-size:12px;color:rgba(255,255,255,.72)}

/* section grid (home nav) */
.nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nav-tile{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
  text-decoration:none;display:flex;flex-direction:column;gap:9px;transition:all .2s ease;cursor:pointer;
}
.nav-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--soft-line)}
.nav-tile .n{font-size:11px;font-weight:700;color:var(--blue);background:var(--soft);width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.nav-tile b{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.nav-tile span{font-size:12px;color:var(--muted);line-height:1.45}

/* news */
.news-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;transition:all .2s ease}
.news-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.news-date{background:var(--soft);color:var(--blue);border-radius:10px;padding:8px 10px;text-align:center;flex-shrink:0;height:fit-content;line-height:1.15}
.news-date b{display:block;font-size:17px;font-weight:700;color:var(--blue)}
.news-date span{font-size:10px;font-weight:600;letter-spacing:.04em}
.news-card h4{font-size:14.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:5px}
.news-card p{font-size:13px;color:var(--text);line-height:1.5}
.news-meta{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--soft)}
.tl-item b{font-size:14px;font-weight:600;color:var(--ink);display:block}
.tl-item span{font-size:12.5px;color:var(--muted)}

/* gauge / radial */
.radial{display:flex;align-items:center;gap:16px}
.radial svg{width:96px;height:96px;flex-shrink:0}
.radial .rv{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1.1}
.radial .rl{font-size:12.5px;color:var(--muted);margin-top:3px}

/* before/after */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ba > div{border-radius:12px;padding:16px;border:1px solid var(--line)}
.ba .before{background:var(--surface)}
.ba .after{background:var(--soft);border-color:var(--soft-line)}
.ba h5{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.ba .after h5{color:var(--blue)}
.ba b{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.03em;display:block}
.ba span{font-size:12.5px;color:var(--muted)}

.note{background:var(--soft);border:1px solid var(--soft-line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--note-ink);display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.note svg{width:16px;height:16px;stroke:var(--note-ink);fill:none;stroke-width:2;flex-shrink:0;margin-top:3px}
.src{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ============ КІТАПХАНАЛАР ПАСПОРТЫ ============ */
.p-demo{display:flex;gap:10px;align-items:flex-start;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.5;margin-bottom:18px}
.p-demo svg{width:17px;height:17px;stroke:#B45309;fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;margin-top:1px}
.p-hero{
  background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 62%,#3B82F6 100%);border-radius:20px;
  padding:clamp(24px,4vw,40px);color:#fff;position:relative;overflow:hidden;margin-bottom:20px;
}
.p-hero::before{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.11) 1.2px,transparent 1.2px);background-size:18px 18px;
  -webkit-mask-image:linear-gradient(100deg,transparent 35%,#000);mask-image:linear-gradient(100deg,transparent 35%,#000);
}
.p-hero::after{content:'';position:absolute;width:380px;height:380px;border-radius:50%;background:rgba(255,255,255,.07);top:-170px;right:-110px}
.p-hero > *{position:relative;z-index:1}
.p-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:16px}
.p-tag svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.p-hero h1{color:#fff;font-size:clamp(26px,3.6vw,38px)}
.p-hero p{color:rgba(255,255,255,.84);font-size:15px;max-width:640px;margin-top:10px}
.p-search{flex:1;min-width:220px;max-width:460px;position:relative;display:block}
.p-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.p-search input{
  width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 36px;transition:border-color .2s ease,box-shadow .2s ease;
}
.p-search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--soft2)}
.p-hero .p-search{max-width:640px;margin-top:22px}
.p-hero .p-search input{padding:15px 16px 15px 46px;font-size:15px;border:0;border-radius:13px;box-shadow:0 12px 32px rgba(15,23,42,.28)}
.p-hero .p-search svg{left:16px;width:18px;height:18px}
.p-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.p-stats > div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);border-radius:14px;padding:14px 16px;backdrop-filter:blur(4px)}
.p-stats b{display:block;font-size:clamp(20px,2.4vw,27px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.p-stats span{font-size:12px;color:rgba(255,255,255,.76)}
.p-stats i{display:block;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:9px;overflow:hidden}
.p-stats i em{display:block;height:100%;background:#fff;border-radius:3px}
.p-empty{text-align:center;color:var(--muted)}
.p-count{font-size:12.5px;color:var(--muted);margin-left:auto}
/* стильдендірілген карта */
.tmap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{
  aspect-ratio:1/.82;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;
  text-decoration:none;min-width:0;border:1px solid rgba(30,58,138,.08);
  transition:transform .18s ease,box-shadow .18s ease;position:relative;
}
.tile:hover{transform:translateY(-3px) scale(1.04);box-shadow:var(--shadow-mid);z-index:2}
.tile b{font-size:11.5px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.tile span{font-size:clamp(13px,1.45vw,19px);font-weight:700;letter-spacing:-.03em;line-height:1}
.tile.dk{color:#fff}.tile.lt{color:var(--blue-900)}
.tmap-legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:14px}
.tmap-legend i{width:180px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--map-lo),var(--map-hi))}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{font-family:inherit;font-size:12px;font-weight:600;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(15,23,42,.12)}
/* түрлер мен көшбасшылар */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:10px}
.stack i{display:block;height:100%;min-width:3px}
.tb-row{display:grid;grid-template-columns:10px 1fr auto 52px;gap:10px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.tb-row:last-child{border-bottom:0}
.tb-row > i{width:10px;height:10px;border-radius:3px}
.tb-row b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tb-row .tb-p{font-size:12px;color:var(--muted);text-align:right}
.lead{display:grid;grid-template-columns:24px 1fr 70px 40px;gap:10px;align-items:center;padding:8px 0;text-decoration:none;font-size:13px;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.lead .ld-n{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:1}
.meter em{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:4px}
.meter.ok em{background:linear-gradient(90deg,#22C55E,#16A34A)}
.meter.warn em{background:linear-gradient(90deg,#FBBF24,#D97706)}
/* облыс карталары */
.reg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.reg-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:all .2s ease}
.reg-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--soft-line)}
.reg-card h4{font-size:14px;font-weight:600;line-height:1.3}
.rc-n{display:flex;align-items:baseline;gap:6px}
.rc-n b{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1}
.rc-n span{font-size:12px;color:var(--muted)}
.reg-card .meter{flex:none}
.rc-foot{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.rc-foot b{color:var(--ink)}
/* облыс беті */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--blue);text-decoration:none;font-weight:600}
.r-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.r-head .eyebrow{font-size:11.5px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.r-head h1{font-size:clamp(22px,2.8vw,30px)}
.r-head p{margin-top:6px;font-size:14px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:inherit;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:all .15s ease}
.chip:hover{border-color:var(--soft-line)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip small{font-size:11px;color:var(--muted);font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on small{color:rgba(255,255,255,.8)}
.p-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.lib-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:all .2s ease}
.lib-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-mid);border-color:var(--soft-line)}
.lib-cover{height:112px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;overflow:hidden}
.lib-cover::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);background-size:14px 14px}
.lib-cover .pill{position:relative;z-index:1;background:rgba(255,255,255,.94);color:var(--blue-900)}
.cv-ic{position:absolute;right:-8px;top:-6px;width:96px;height:96px;stroke:rgba(255,255,255,.28);fill:none;stroke-width:1.2;transform:rotate(-12deg)}
.lib-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.lib-body h4{font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.35}
.lib-meta{font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.lib-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.lib-stats b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.lib-stats span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.lib-c{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:auto;padding-top:6px;min-width:90px}
.lib-tbl td.nm a{color:var(--ink);font-weight:600;text-decoration:none}
.lib-tbl td.nm a:hover{color:var(--blue)}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.more-btn{display:block;margin:20px auto 0;font-family:inherit;font-size:13px;font-weight:600;padding:11px 24px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer;transition:all .15s ease}
.more-btn:hover{border-color:var(--blue);box-shadow:var(--shadow)}
/* паспорт беті */
.pd-cover{height:clamp(170px,22vw,240px);border-radius:20px;position:relative;overflow:hidden}
.pd-cover::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.2px);background-size:18px 18px}
.pd-cover .cv-ic{width:220px;height:220px;right:30px;top:-20px}
.pd-card{position:relative;margin:-64px 22px 20px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--shadow-mid);border-radius:18px}
.pd-card h1{font-size:clamp(22px,2.8vw,30px);margin:10px 0 12px}
.pd-meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px}
.pd-meta span{display:inline-flex;gap:7px;align-items:center;overflow-wrap:anywhere}
.pd-meta svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0}
.pd-meta a{color:var(--blue);text-decoration:none;font-weight:500}
.pd-side{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.btn-ghost{font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.eq{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.eq div{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,var(--card),var(--surface))}
.eq svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eq b{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1}
.eq span{font-size:11.5px;color:var(--muted);line-height:1.3}
.eq div.none svg{stroke:var(--faint)}.eq div.none b{color:var(--faint)}
.eq b.txt{font-size:14px;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.eq em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--blue);line-height:1.3;overflow-wrap:anywhere;margin-top:-2px}
.pass-tbl td{vertical-align:top}
.pass-tbl td.c{width:44px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pass-tbl td.pv{font-weight:600;color:var(--ink);text-align:right;overflow-wrap:anywhere;width:42%}
.pass-tbl td.pv.none{color:var(--faint);font-weight:500}
.pass-tbl td.pv a{color:var(--blue);text-decoration:none}
.pass-tbl tr.wide td{padding-top:12px;padding-bottom:14px}
.pass-tbl tr.wide .pl{color:var(--text)}
.pv-block{margin-top:6px;color:var(--ink);font-size:13.5px;font-weight:500;line-height:1.55;overflow-wrap:anywhere}
.pv-block a,.vchip a,.person a{color:var(--blue);text-decoration:none;font-weight:500}
.pv-block a:hover,.vchip a:hover,.person a:hover{text-decoration:underline}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink);line-height:1.45;max-width:100%;overflow-wrap:anywhere}
.person{display:flex;gap:12px;align-items:flex-start;margin-top:10px}
.ps-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#60A5FA);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;letter-spacing:.02em}
.person > div{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;line-height:1.45}
.person b{font-size:14px;font-weight:600;color:var(--ink)}
.person span{color:var(--muted);overflow-wrap:anywhere}
.person .ps-tel{display:inline-flex;align-items:center;gap:6px;width:fit-content}
.person .ps-tel svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.cmp-row{padding:11px 0;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:0}
.cmp-row .hd{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:8px}
.cmp-row .hd b{font-weight:700}
.cmp-bars{display:grid;gap:6px}
.cmp-bars div{display:grid;grid-template-columns:110px 1fr 80px;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
.cmp-bars i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--blue-dark))}
.cmp-bars .avg i{background:var(--faint)}
.cmp-bars em{font-style:normal;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.print-logo{display:none}
.pp{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm 11mm}
  body:has(.pp) .print-logo{display:none!important}
  .page:has(.pp)>:not(.pp){display:none!important}
  .pp{display:block;color:#0F172A;font-size:8.6pt;line-height:1.32;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:7px;
    border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#2563EB,#7C3AED,#C026D3) 1}
  .pp-head img{height:17mm;width:auto;display:block}
  .pp-head div{text-align:right;display:flex;flex-direction:column;gap:1px}
  .pp-head b{font-size:12pt;letter-spacing:.06em;text-transform:uppercase;color:#2563EB}
  .pp-head span{font-size:7.6pt;color:#64748B}
  .pp-title{margin:9px 0 8px}
  .pp-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .pp-tags span{font-size:7.2pt;font-weight:600;color:#1D4ED8;background:#EFF6FF;border:1px solid #DBEAFE;border-radius:20px;padding:1px 7px}
  .pp-title h1{font-size:14pt;line-height:1.22;margin:0;font-weight:700;color:#0F172A}
  .pp-kpi{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #DBEAFE;border-radius:8px;overflow:hidden;margin-bottom:9px;background:#F8FAFF}
  .pp-kpi div{padding:5px 8px;border-left:1px solid #DBEAFE;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
  .pp-kpi div:first-child{border-left:0}
  .pp-kpi span{font-size:6.9pt;color:#64748B;line-height:1.2}
  .pp-kpi b{font-size:12pt;color:#1E3A8A;font-variant-numeric:tabular-nums}
  .pp-kpi .fill{background:linear-gradient(135deg,#2563EB,#7C3AED)}
  .pp-kpi .fill span,.pp-kpi .fill b{color:#fff}
  .pp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;align-items:start}
  .pp-full{grid-column:1/-1}
  .pp-sec{break-inside:avoid}
  .pp-sec .pp-sec{display:contents}
  .pp-sec h3{display:flex;align-items:center;gap:6px;font-size:9pt;font-weight:700;margin:0 0 3px;color:#0F172A;
    padding-bottom:3px;border-bottom:1px solid #CBD5E1;break-after:avoid}
  .pp-sec h3 i{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;background:#2563EB;color:#fff;font-size:7.5pt}
  .pp-sec table{width:100%;border-collapse:collapse}
  .pp-sec td{padding:2.6px 3px;border-bottom:1px solid #EEF2F7;vertical-align:top}
  .pp-sec tr{break-inside:avoid}
  .pp-sec td.c{width:24px;color:#94A3B8;font-size:7.2pt;padding-top:3.4px;font-variant-numeric:tabular-nums}
  .pp-sec td.l{color:#475569}
  .pp-sec td.v{text-align:right;font-weight:600;white-space:nowrap;padding-left:8px}
  .pp-sec td.v.no{color:#CBD5E1;font-weight:400}
  .pp-sec tr.w .l{display:block;color:#475569}
  .pp-sec tr.w .v{font-weight:600;margin-top:1px;overflow-wrap:anywhere}
  .pp-eq{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 3px}
  .pp-eq div{border:1px solid #E2E8F0;border-radius:6px;padding:3px 5px;background:#F8FAFC;display:flex;flex-direction:column}
  .pp-eq b{font-size:10.5pt;color:#1E3A8A;line-height:1.15;overflow-wrap:anywhere}
  .pp-eq b.t{font-size:8pt}
  .pp-eq em{font-style:normal;font-size:6.6pt;color:#334155;line-height:1.2;margin-bottom:1px}
  .pp-eq span{font-size:6.6pt;color:#64748B;line-height:1.2;margin-top:auto}
  .pp-per{margin:4px 0 0;font-size:7.4pt;color:#64748B}
  .pp-foot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding-top:5px;border-top:1px solid #E2E8F0;font-size:7pt;color:#94A3B8}
  .print-logo{display:block;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #E2E8F0}
  .print-logo img{height:20mm;width:auto;display:block}
  .sidebar,.topbar,.site-foot,.scrim,.btn-ghost,.crumbs,.p-demo{display:none!important}
  .main{margin-left:0}.content{padding:0}
  .card{break-inside:avoid;box-shadow:none!important}
  .pd-cover{height:110px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}


/* ============ ӘДІСКЕРЛЕР КАБИНЕТІ ============ */
.cab-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;flex-shrink:0;transition:all .18s ease}
.cab-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.cab-btn:hover,.cab-btn.on{border-color:var(--blue);color:var(--blue)}
.cab-btn.on{background:var(--soft)}
.q-info{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 12px}
/* Кітапханалар не оқып, не ұсынып жатыр? */
.bk-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bk-own{font-size:15px;color:var(--ink)}
.bk-tbl td{vertical-align:top;padding:5px 6px}
.bk-tbl .inp{min-width:120px}
.bk-tbl td:nth-child(3) .inp{min-width:220px}
.bk-tbl .inp.num{width:110px;min-width:90px;text-align:right}
.rd-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 0}
.rd-tabs button{font-family:inherit;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:all .15s ease}
.rd-tabs button b{font-size:15px;color:var(--ink)}
.rd-tabs button span{font-size:12.5px;color:var(--muted)}
.rd-tabs button:hover{border-color:var(--soft-line)}
.rd-tabs button.on{background:linear-gradient(135deg,var(--blue),#7C3AED);border-color:transparent}
.rd-tabs button.on b,.rd-tabs button.on span{color:#fff}
.rd-k3{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.rd-k3 b{font-size:17px;color:var(--ink);line-height:1.25}
.rd-k3 span{font-size:12.5px;color:var(--muted)}
.rd-list{display:grid;gap:10px}
.rd-card{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;cursor:pointer;transition:all .15s ease}
.rd-card:hover,.rd-card:focus-visible{border-color:var(--soft-line);box-shadow:var(--shadow)}
.rd-card.open{border-color:var(--blue)}
.rd-n{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:14px}
.rd-card:nth-child(-n+3) .rd-n{background:linear-gradient(135deg,var(--blue),#7C3AED);color:#fff}
.rd-m{min-width:0;display:flex;flex-direction:column;gap:3px}
.rd-m b{font-size:15px;color:var(--ink);line-height:1.3}
.rd-m > span{font-size:13px;color:var(--text)}
.rd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.rd-tags i{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--muted)}
.rd-tags i.c{background:var(--soft);color:var(--blue)}
.rd-s{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.rd-s b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.rd-s span,.rd-s small{font-size:11.5px;color:var(--muted)}
.rd-libs{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px;cursor:default}
.rd-lh{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.rd-lib{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;font-size:13px;color:var(--text)}
.rd-lib:hover{background:var(--surface)}
.rd-ln{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-lr,.rd-lc{font-size:12px;color:var(--muted);white-space:nowrap}
.rd-lk{font-weight:600;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:720px){.rd-tabs{grid-template-columns:1fr}.rd-card{grid-template-columns:34px 1fr;padding:12px 14px}.rd-s{grid-column:2;flex-direction:row;align-items:baseline;gap:6px;text-align:left}
  .rd-lib{grid-template-columns:1fr auto}.rd-lr,.rd-lc{display:none}}
.year-note{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink);background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px 14px;margin:0 0 18px}
.year-note svg{width:17px;height:17px;flex-shrink:0;margin-top:2px;stroke:#B45309;fill:none;stroke-width:2}
:root[data-theme="dark"] .year-note{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35)}
.q-info.arch{color:var(--ink);background:var(--soft);border:1px solid var(--soft-line);border-radius:10px;padding:9px 12px;margin:0 0 16px}
.cab-arch td{background:var(--surface)}
.yr-sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.yr-sw span{font-size:13px;color:var(--muted);margin-right:2px}
.yr-sw a{font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none}
.yr-sw a:hover{border-color:var(--blue);color:var(--blue)}
.yr-sw a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.kpi-d{font-size:12px;font-weight:600;margin-top:4px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi-d.up{color:#059669}.kpi-d.down{color:#DC2626}
.q-info svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2;flex-shrink:0}
.cab{display:flex;flex-direction:column;gap:16px}
.cab-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px}
.cab-who{display:flex;gap:12px;align-items:center;min-width:0}
.cab-who b{display:block;color:var(--ink);font-size:15px}
.cab-who span:not(.ps-av){font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cab-tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;max-width:100%}
.cab-tabs a{font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap}
.cab-tabs a:hover{color:var(--ink);background:var(--surface)}
.cab-tabs a.on{background:var(--blue);color:#fff;font-weight:600}
.cab-period{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cab-period label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.cab-ptxt{font-size:13px;font-weight:600;color:var(--ink)}
.cab-sum{display:grid;grid-template-columns:1fr minmax(220px,360px);gap:16px;align-items:center}
.cab-sum b{display:block;font-size:17px;color:var(--ink);margin:2px 0}
.cab-k{font-size:12.5px;color:var(--muted)}
.cab-prog-t{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.cab-libs{display:grid;gap:8px}
.cab-lib{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;text-decoration:none}
.cab-lib:hover{border-color:var(--soft-line);box-shadow:var(--shadow)}
.cab-lib-m{min-width:0}
.cab-lib-m b{display:block;color:var(--ink);font-size:14px;font-weight:600;line-height:1.35}
.cab-lib-m span{font-size:12px;color:var(--muted)}
.cab-lib-s{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.cab-lib-s small{font-size:11.5px;color:var(--muted)}
.cbtn{font-family:inherit;font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease;white-space:nowrap}
.cbtn:hover{border-color:var(--blue);color:var(--blue)}
.cbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.cbtn.primary:hover{background:var(--blue-dark);color:#fff}
.cbtn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.cbtn.wide{width:100%;padding:12px}
.cbtn:disabled{opacity:.6;cursor:wait}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text);min-width:0}
.fld > span{font-weight:500;color:var(--ink)}
.fld-in{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.inp{font-family:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .2s ease,box-shadow .2s ease}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--soft2)}
.inp.sm{padding:7px 9px;font-size:13px;width:auto}
.inp.num{font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;max-width:280px}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.12)}
.req{color:var(--red);font-style:normal}
.fld-hint{font-size:12px;color:var(--muted)}
.fld-err{font-size:12.5px;color:var(--red);min-height:0}
.fld-err:empty{display:none}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer}
.cab-form{display:flex;flex-direction:column;gap:16px}
.cab-form h3,.cab-h3{font-size:16px;margin-bottom:4px}
.cab-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.cab-ed-hd h1{font-size:clamp(19px,2.4vw,26px);margin:10px 0 6px}
.cab-upd{font-size:13px;color:var(--ink);margin-top:8px;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.cab-upd.warn{color:#B45309;background:#FFFBEB;border-color:#FDE68A}
:root[data-theme="dark"] .cab-upd.warn{color:#FCD34D;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3)}

"kk":"Жаңғырту бойынша көш бастаушы — Батыс Қазақстан облысы: 15 ауданда 23 аудандық және ауылдық кітапхана жаңартылды. Солтүстік Қазақстан облысында екі кітапханада заманауи IT-хаб ашылды, Ақтауда орталық қалалық кітапхана CREATIVE HUB форматында қайта жұмыс бастады.",
"ru":"Лидер по модернизации — Западно-Казахстанская область: в 15 районах обновлены 23 районные и сельские библиотеки. В Северо-Казахстанской области в двух библиотеках открыты современные IT-хабы, в Актау центральная городская библиотека возобновила работу в формате CREATIVE HUB.",
"en":"West Kazakhstan leads modernisation: 23 district and rural libraries renovated across 15 districts. Two libraries in North Kazakhstan opened modern IT hubs, and Aktau's central city library reopened as a CREATIVE HUB."

let LANG = localStorage_get("laba_lang") || "kk";

function localStorage_get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function localStorage_set(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

/* Мәтін алу: T("s3.k1") немесе орын толтырғышпен T("s3.k3s",{a:459}) */
function T(key, vars){
  const row = TXT[key];
  let s = row ? (row[LANG] || row.kk) : key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split("{"+k+"}").join(vars[k]); });
  return s;
}
/* Дерек ішіндегі атауды аудару */
function nm(name){
  if(LANG === "kk" || !name) return name;
  const row = NAMES[name];
  if(row && row[LANG]) return row[LANG];
  const clean = String(name).replace(/\n/g," ").trim();
  const row2 = NAMES[clean];
  return (row2 && row2[LANG]) ? row2[LANG] : name;
}

/* ─────────────── КӨМЕКШІЛЕР ─────────────── */
const nf  = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const df  = n => Number(n).toFixed(1).replace(".", LANG==="en" ? "." : ",");
const pf  = n => df(n)+"%";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chg = (v,p) => (p===null||p===undefined||!p) ? null : (v-p)/p*100;

function deltaHtml(d,extra){
  if(d===null||d===undefined) return "";
  const cls = d>0?"up":(d<0?"down":"flat");
  const ar  = d>0?"▲":(d<0?"▼":"—");
  return `<div class="delta ${cls}">${ar} ${df(Math.abs(d))}%
    <span style="color:var(--muted);font-weight:500">${extra||T("vsPrev")}</span></div>`;
}
const ICONS = {
  book:'<path d="M4 5h7v15H4zM13 5h7v15h-7z"/>',
  users:'<path d="M12 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM4 20a8 8 0 0116 0"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
  chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 000 18 14 14 0 000-18z"/>',
  doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  home:'<path d="M4 10l8-6 8 6v10H4z"/>'
};
function kpi(label, value, o){
  o = o || {};
  const fmt = o.fmt || "int";
  const v = fmt==="int" ? nf(value) : (fmt==="pct" ? pf(value) : df(value));
  return `<div class="card kpi hov">
    <div class="lbl"><span>${esc(label)}</span>
      <span class="ic"><svg viewBox="0 0 24 24">${ICONS[o.icon||"chart"]}</svg></span></div>
    <div class="num">${v}</div>
    ${o.sub?`<div class="sub">${esc(o.sub)}</div>`:""}
    ${deltaHtml(o.delta, o.deltaLabel)}</div>`;
}
function panel(id, title, desc, body){
  return `<div class="card">
    <div class="panel-hd">
      <div><h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:""}</div>
      ${id?`<button class="dl" data-dl="${id}" title="${T("download")}" aria-label="${T("download")}">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>`:""}
    </div>${body}</div>`;
}
const cv = (id,size) => `<div class="cbox ${size||""}"><canvas id="${id}"></canvas></div>`;

function barList(rows, fmtv){
  const m = Math.max.apply(null, rows.map(r=>r.value));
  return rows.map(r=>`<div class="bar-row">
    <span class="nm">${esc(r.name)}</span>
    <span class="bar-track"><span class="bar-fill" data-w="${(r.value/m*100).toFixed(1)}"></span></span>
    <span class="vv">${(fmtv||nf)(r.value)}</span></div>`).join("");
}
function radial(pct,label,color){
  const r=42, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="radial">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" style="stroke:var(--track)" stroke-width="10"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color||"#2563EB"}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 50 50)"/></svg>
    <div><div class="rv">${df(pct)}%</div><div class="rl">${esc(label)}</div></div></div>`;
}
function note(html){
  return `<div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/>
    <path d="M12 8v5M12 16h.01"/></svg><span>${html}</span></div>`;
}
function head(title, desc){
  return `<div class="ph"><div class="eyebrow">${DATA.meta.current.year} · ${esc(T("period"))}</div>
    <h1>${esc(title)}</h1><p>${esc(desc)}</p></div>`;
}

function chartTheme(){
  const d = isDark();
  Chart.defaults.color = d ? "#94A3B8" : "#64748B";
  Chart.defaults.borderColor = d ? "#24314A" : "#E2E8F0";
  Chart.defaults.plugins.tooltip.backgroundColor = d ? "#1E293B" : "#0F172A";
  GRID.grid.color = d ? "#1F2B42" : "#F1F5F9";
}

const PALETTE = ["#2563EB","#60A5FA","#BFDBFE","#1E40AF","#93C5FD","#3B82F6","#1D4ED8","#DBEAFE"];

function mk(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
const hbar = (labels,data,color) => ({
  type:"bar",
  data:{labels:labels,datasets:[{data:data,backgroundColor:color||"#2563EB",borderRadius:5,barThickness:13}]},
  options:{indexAxis:"y",maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:GRID,y:NOGRID}}
});
const donut = (labels,data,suffix) => ({
  type:"doughnut",
  data:{labels:labels,datasets:[{data:data,backgroundColor:PALETTE,borderWidth:0}]},
  options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom"},
    tooltip:{callbacks:{label:c=>" "+(suffix==="%"?df(c.raw)+"%":nf(c.raw))}}}}
});

P.fund.charts = () => {
  const f = DATA.fund;

  /* Өңірлер бойынша қор — жол саны көп болғандықтан бөлек баптау */
  (function(){
    const box = document.getElementById("cFundRegion");
    if(box && box.parentElement) box.parentElement.style.height = (r.length*27 + 44) + "px";
    const vals = r.map(x=>x.fund);
    const mx = Math.max.apply(null,vals), mn = Math.min.apply(null,vals), span = (mx-mn)||1;

      const k = 0.18 + 0.82*((v-mn)/span);
      const a=[191,219,254], b=[29,78,216];
      return "rgb("+a.map((c,i)=>Math.round(c+(b[i]-c)*k)).join(",")+")";
    });
    const fundLabel = {
      id:"fundEndLabel",
      afterDatasetsDraw(ch){
        const ctx = ch.ctx;
        ctx.save();
        ctx.font = "600 11px Inter, sans-serif";

        ctx.textBaseline = "middle";
        ch.getDatasetMeta(0).data.forEach((bar,i)=>ctx.fillText(nf(vals[i]), bar.x+8, bar.y));
        ctx.restore();
      }
    };
    mk("cFundRegion",{
      type:"bar",
      data:{labels:r.map(x=>nm(x.name)),datasets:[{
        data:vals, backgroundColor:cols,
        borderRadius:5, borderSkipped:false,

      },
      plugins:[fundLabel]
    });
  })();

        tooltip:{callbacks:{label:c=>" "+c.dataset.label+": "+df(c.raw)+"%"}}},
      scales:{x:Object.assign({max:5.2},GRID),y:NOGRID}}});

  const sp = DATA.supply.byRegion.slice().sort((x,y)=>y.y2025-x.y2025);
  mk("cSupply",{type:"bar",
    data:{labels:sp.map(x=>nm(x.region)),datasets:[{data:sp.map(x=>x.y2025),

/* ── Паспорт мәндерін көрсету ── */
/* Мәтін ішіндегі сілтемелерді басылатын етеді (алдымен esc, сосын сілтеме) */
function linkify(t){
  return esc(t).replace(/https?:\/\/[^\s<,;]+/gi, u=>{
    const href = u.replace(/[.)]+$/,""), tail = u.slice(href.length);
    let show = href.replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,"");
    if(show.length>42) show = show.slice(0,40)+"…";
    return `<a href="${href}" target="_blank" rel="noopener">${show}</a>${tail}`;
  });
}
/* «А / Б / В» немесе бірнеше сілтеме «x, y» → бөліктер тізімі */
function splitVal(v){
  const urls = (v.match(/https?:\/\//gi)||[]).length;
  const parts = v.split(urls>1 ? /\s+\/\s+|,\s+|\s*;\s*/ : /\s+\/\s+|\s*;\s*/);
  const out = [];
  parts.map(x=>x.trim()).filter(Boolean).forEach(x=>{
    /* «…rsl.ru / #colf=…» сияқты сілтеменің жалғасын алдыңғы бөлікке қосамыз */
    if(out.length && /^[#?&=]/.test(x)) out[out.length-1] += "/" + x; else out.push(x);
  });
  return out;
}
const isPhone = x => (x.replace(/\D/g,"").length>=7) && /^[\d\s()+\-–,.]+$/.test(x.replace(/тел\.?|ұялы|байланыс телефоны|телефон|:/gi,"").trim());
/* 5.2 — тек аты-жөні мен телефон: кадрлық мәліметтер (білімі, өтілі т.б.) көрсетілмейді */
function personHtml(v){
  const phoneRe = /\+?\d[\d\s()\-–.]{4,}\d/g;
  const isYears = m => /^(19|20)\d{2}(\s*[-–.]\s*(19|20)?\d{2})?$/.test(m.trim());
  const name = (v.split(/\s+\/\s+|\s*;\s*/)[0] || "").replace(phoneRe, m=>isYears(m) ? m : "")
    .replace(/\b(тел|телефон|байланыс телефоны)\.?\s*:?/gi,"").replace(/[\s,;:–\-/]+$/,"").trim();
  const phones = [];
  (v.match(phoneRe)||[]).forEach(m=>{ const d = m.replace(/\D/g,"");
    if(d.length>=6 && d.length<=12 && !isYears(m) && phones.indexOf(m.trim())<0) phones.push(m.trim()); });
  const ini = name.split(/\s+/).filter(w=>/^[A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүІіҺһ]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("");
  const tels = phones.map(x=>`<a class="ps-tel" href="tel:${esc(x.replace(/[^\d+]/g,""))}">${svg(PI.phone)}${esc(x)}</a>`).join("");
  return `<div class="person"><span class="ps-av">${esc(ini||"•")}</span><div><b>${esc(name||"—")}</b>${tels}</div></div>`;
}
function valBlock(c, v){
  if(c==="5.2") return personHtml(v);
  const parts = splitVal(v);
  if(parts.length>1) return `<div class="vchips">${parts.map(x=>`<span class="vchip">${linkify(x)}</span>`).join("")}</div>`;
  return `<div class="pv-block">${linkify(parts[0]||v)}</div>`;
}
/* Бір жол: қысқа мән — оң жақта, ұзын мән/тізім — атауының астында толық енде */
function passRow(c, v){
  /* сандық өрістер («73 / 39») бөлінбейді — бір жолда, оң жақта тұрады */
  const wide = v && (c==="5.2" || v.length>36 || (NUMF.indexOf(c)<0 && splitVal(v).length>1));
  if(wide) return `<tr class="wide"><td class="c">${c}</td><td colspan="2"><div class="pl">${esc(pl(c))}</div>${valBlock(c,v)}</td></tr>`;
  return `<tr><td class="c">${c}</td><td>${esc(pl(c))}</td><td class="pv${v?"":" none"}">${v?linkify(v):"—"}</td></tr>`;
}
function secTable(g, skip){
  const rows = g.f.filter(f=>(skip||[]).indexOf(f[0])<0 && !(f[2] && !pv(PASS._cur,f[0]))).map(f=>passRow(f[0], pv(PASS._cur,f[0]))).join("");
  return panel(null, g.n+". "+tx(g.t), "", `<table class="tbl pass-tbl"><tbody>${rows}</tbody></table>`);

/* Сайттағы дерек файлдары (тізілім): Google Sheets-тен дерек келмесе, осылар көрсетіледі */
const PASS_STATIC = "data/passports-index.json";
const passChunk = id => "data/passports/" + Math.floor(Number(id)/200) + ".json";
function rerenderIfOpen(id){
  const h = location.hash.slice(1), base = "passport/"+encodeURIComponent(id);
  if(h===base || h.indexOf(base+"/")===0) render(h);
}
/* Паспорттың мұрағаттағы жылдары (тек тірі деректе; сайттың файлдарында — тек 2025 жыл) */
function requestHist(id){
  if(PASS.histPending[id] || PASS.hist[id]) return;
  if(PASS.src!=="live"){ PASS.hist[id] = []; return; }
  PASS.histPending[id] = 1;
  jsonp({action:"passHistory", id:id}, res=>{
    PASS.histPending[id] = 0;
    PASS.hist[id] = (res && res.ok && res.years || []).map(y=>Object.assign(normPass(y), {year:Number(y.year), at:String(y.archived_at||"")}));
    rerenderIfOpen(id);
  }, 20000, ()=>{ PASS.histPending[id] = 0; PASS.hist[id] = []; rerenderIfOpen(id); });
}
/* Мұрағаттағы мән ағымдағымен бірдей болса — ағымдағы паспорттың аудармасын қолданамыз */
function archTr(a, cur){
  if(!cur || !cur.tr) return a;
  ["ru","en"].forEach(l=>{ const t = cur.tr[l]||{};
    Object.keys(t).forEach(c=>{ if(c==="d" ? a.d===cur.d : (a.f[c] && a.f[c]===cur.f[c])) a.tr[l][c] = t[c]; }); });
  return a;
}
const fmtDay = s => { const d = String(s||"").slice(0,10).split("-"); return d.length===3 ? d[2]+"."+d[1]+"."+d[0] : ""; };
function requestFull(id){
  if(PASS.pending[id]) return;
  PASS.pending[id] = 1;
  if(PASS.src==="static"){
    fetch(passChunk(id)).then(r=>r.ok ? r.json() : null).then(map=>{
      PASS.pending[id] = 0;
      if(!map || PASS.src!=="static") return;
      Object.keys(map).forEach(k=>{ PASS.full[k] = normPass(map[k]); });
      rerenderIfOpen(id);
    }).catch(()=>{ PASS.pending[id] = 0; });
    return;
  }
  jsonp({action:"passport", id:id}, res=>{
    PASS.pending[id] = 0;
    if(res && res.ok && res.passport){
      const x = normPass(res.passport);
      PASS.full[id] = x;
      rerenderIfOpen(id);
      /* толық паспорттың аудармалары — сайттың файлынан */
      if(window.fetch && location.protocol!=="file:") fetch(passChunk(id)).then(r=>r.ok ? r.json() : null).then(map=>{
        if(map && map[id]){ mergeTr([x], [normPass(map[id])]); rerenderIfOpen(id); }
      }).catch(()=>{});
    }
  }, 20000, ()=>{ PASS.pending[id] = 0; });
}
/* Негізгі көрсеткіштердің кезеңі мен жаңартылған күні (аты-жөні ашық сайтта көрсетілмейді) */
function qInfo(x){
  const q = String(x.q || "").split("-");
  if(q.length !== 2){
    const h = PASS.hist[x.id], y = h && h.length ? h[0].year : PASS_BASE_YEAR;
    return `<div class="q-info">${svg(PI.info)}<span>${esc(T("p.qbase",{y:y}))}</span></div>`;

  return `<div class="q-info">${svg(PI.info)}<span>${esc(per)}${d.length===3 ? " · " + esc(T("p.qupd",{d:d[2]+"."+d[1]+"."+d[0]})) : ""}</span></div>`;
}
/* Кезеңнің жазуы: бекітілген тоқсандар (qs) бойынша — «2026 жыл, I–II тоқсан (алдын ала)» немесе «2026 жылдың қорытындысы» */
function qLabel(x){
  const q = String(x.q || "").split("-"), R = ["","I","II","III","IV"];
  const qs = String(x.qs || "");
  if(qs.length===4) return T("p.qfull",{y:q[0]});
  if(qs) return T("p.qytd",{y:q[0], q: qs.length===1 ? R[+qs] : qs.split("").map(n=>R[+n]).join(", ")});
  return T("p.qper",{y:q[0], q:R[+q[1]] || q[1]});
}
/* ── Паспорттың баспа нұсқасы: A4, ықшам, 2 беттен аспайды ── */
const PP_MAX = 520;                                   // өте ұзын мәтін қысқартылады (толығы сайтта)
const ppCut = v => v.length > PP_MAX ? v.slice(0, PP_MAX).replace(/\s+\S*$/, "") + " …" : v;
function ppPerson(v){
  const phoneRe = /\+?\d[\d\s()\-–.]{4,}\d/g;
  const isYears = m => /^(19|20)\d{2}(\s*[-–.]\s*(19|20)?\d{2})?$/.test(m.trim());
  const name = (v.split(/\s+\/\s+|\s*;\s*/)[0] || "").replace(phoneRe, m=>isYears(m) ? m : "")
    .replace(/\b(тел|телефон|байланыс телефоны)\.?\s*:?/gi,"").replace(/[\s,;:–\-/]+$/,"").trim();
  const phones = [];
  (v.match(phoneRe)||[]).forEach(m=>{ const d = m.replace(/\D/g,"");
    if(d.length>=6 && d.length<=12 && !isYears(m) && phones.indexOf(m.trim())<0) phones.push(m.trim()); });

/* KPI астындағы салыстыру: «2025: 14 977 · ▲ 3,2%» (мән өзгерсе ғана) */
function kpiDelta(f, base, c){
  if(!base) return "";
  const me = num(pv(f,c)), was = num(pv(base,c));
  if(me===null || was===null || me===was) return "";
  const d = was ? (me-was)/was*100 : 0, up = me > was;
  return `<div class="kpi-d ${up?"up":"down"}">${base.year}: ${nf(was)}${was?` · ${up?"▲":"▼"} ${df(Math.abs(d))}%`:""}</div>`;
}

/* Паспорттар тізімін жүктеу: сайттағы дерек файлы бірден көрсетіледі,
   Google Sheets-тен дерек келсе — соған ауысады. Толық паспорт ашқанда бөлек жүктеледі. */
function mergeTr(target, source){
  const by = {};
  source.forEach(x=>{ by[x.id] = x.tr; });
  target.forEach(x=>{ const t = by[x.id]; if(t) ["ru","en"].forEach(l=>{ x.tr[l] = Object.assign({}, t[l], x.tr[l]); }); x._q = ""; });
}
function loadPassports(){
  const done = () => {
    PASS._statsFor = null;
    if((location.hash.slice(1)||"home").split("/")[0]==="passport") render(location.hash.slice(1));
  };
  const apply = (res, src) => {
    const rows = res && res.ok!==false ? unpackPass(res) : null;
    const list = rows ? rows.map(normPass).filter(x=>pv(x,"1.1")) : [];
    if(!list.length) return false;
    if(src==="live" && PASS.src==="static") mergeTr(list, PASS.list);       // аудармалар тек сайттың файлдарында
    PASS.list = list; PASS.src = src; PASS.full = {}; PASS.pending = {}; PASS.hist = {}; PASS.histPending = {}; PASS.status = "ok";
    done();
    return true;
  };
  let left = 2;
  const fail = () => { if(--left===0 && !PASS.list.length){ PASS.status = "error"; done(); } };
  if(window.fetch && location.protocol!=="file:"){
    fetch(PASS_STATIC).then(r=>r.ok ? r.json() : null)
      .then(res=>{
        if(PASS.src==="live"){                                               // тірі дерек бұрын келсе — тек аудармаларды аламыз
          const rows = res ? unpackPass(res) : null;
          if(rows){ mergeTr(PASS.list, rows.map(normPass)); done(); }
          return;
        }
        if(!apply(res,"static")) fail();
      })
      .catch(fail);
  } else fail();
  if(API_URL) jsonp({action:"passports"}, res=>{ if(!apply(res,"live")) fail(); }, 25000, fail);
  else fail();
}

/* ─────────────── 3. КІТАПХАНАЛАР НЕ ОҚЫП, НЕ ҰСЫНЫП ЖАТЫР? ───────────────

   Бірдей кітаптар (атауы бірдей, авторының тегі сәйкес) бір картаға біріктіріледі. */
const READS = {data:null, status:"", kind:"rec", cat:0, q:"", owner:"", open:{}};

/* Ресми атаудан қысқа атау: «…» ішіндегі бөлігі, басқарма/комитет атауынсыз */
function shortLib(n){
  n = String(n||"");
  const q = n.match(/«[^«»]{8,}»/g);
  if(q) n = q[q.length-1].slice(1,-1);
  n = n.replace(/^.*(басқармасының|комитетінің|әкімдігінің)\s+/,"").replace(/\s*\/\s*/g," ").replace(/\s+/g," ").trim();
  return n.charAt(0).toUpperCase() + n.slice(1);
}
const rdNorm = s => String(s||"").toLowerCase().replace(/[«»"“”„'`.,:;!?()\[\]\-–—]/g," ").replace(/ё/g,"е").replace(/\s+/g," ").trim();
const rdTok = a => rdNorm(a).split(" ").filter(w=>w.length>2);
/* Тізімдерді кітаптар бойынша топтау */
function rdGroups(){
  const d = READS.data; if(!d) return [];
  const own = {}; d.owners.forEach(o=>{ own[o.id] = o; });
  const q = rdNorm(READS.q);
  const items = d.items.filter(i=>i.kind===READS.kind && (!READS.cat || i.cat===READS.cat) && (!READS.owner || i.owner===READS.owner)
    && (!q || rdNorm(i.title+" "+i.author).indexOf(q)>-1));
  const byTitle = {};
  items.forEach(i=>{
    const tk = rdNorm(i.title), at = rdTok(i.author);
    const list = byTitle[tk] = byTitle[tk] || [];
    let g = list.find(x=>x.tok.some(w=>at.indexOf(w)>-1) || (!x.tok.length && !at.length));
    if(!g){ g = {key:tk+"|"+at.join(" "), title:String(i.title).replace(/[\s.,;:]+$/,""), author:i.author, tok:at, lang:i.lang, genre:i.genre, libs:{}, cats:{}, count:0, best:99, items:[]}; list.push(g); }
    g.items.push(Object.assign({o:own[i.owner]}, i));
    g.libs[i.owner] = 1; g.cats[i.cat] = 1; g.best = Math.min(g.best, i.rank);
    const n = +String(i.count||"").replace(/\s/g,""); if(n) g.count += n;
    if(!g.lang && i.lang) g.lang = i.lang; if(!g.genre && i.genre) g.genre = i.genre;
  });
  const out = [].concat.apply([], Object.keys(byTitle).map(k=>byTitle[k]));
  out.forEach(g=>{ g.nlib = Object.keys(g.libs).length; });
  return out.sort(READS.kind==="top"
    ? (a,b)=>b.count-a.count || b.nlib-a.nlib || a.best-b.best
    : READS.owner ? (a,b)=>a.best-b.best : (a,b)=>b.nlib-a.nlib || a.best-b.best || (a.title>b.title?1:-1));
}
const RD_CATS = () => [1,2,3,4,5].map(n=>T("rd.c"+n));
function rdCard(g, i){

  /* бір кітапхана — бір жол: қай санаттарда, ең жоғары орны, оқылу саны */
  const byLib = {};
  g.items.forEach(x=>{ const b = byLib[x.owner] = byLib[x.owner] || {o:x.o, owner:x.owner, cats:[], rank:99, count:0};
    if(b.cats.indexOf(x.cat)<0) b.cats.push(x.cat); b.rank = Math.min(b.rank, x.rank); b.count += +String(x.count||"").replace(/\s/g,"") || 0; });
  const regName = o => o ? (o.st==="rep" ? T("rd.rep") : tx((REG.find(r=>r.src && o.region.indexOf(r.src)===0)||{}).n) || o.region) : "";
  const rows = Object.keys(byLib).map(k=>byLib[k]).sort((a,b)=>READS.kind==="top" ? b.count-a.count : a.rank-b.rank || b.cats.length-a.cats.length)
    .map(x=>`<a class="rd-lib" href="#passport/${esc(x.owner)}"><span class="rd-ln" title="${esc(x.o ? x.o.name : "")}">${esc(x.o ? shortLib(x.o.name) : x.owner)}</span>

/* ─────────────── APPS SCRIPT БАЙЛАНЫСЫ ─────────────── */
let jsonpSeq = 0;
function jsonp(params, cb, timeout, fail){
  if(!API_URL) return;
  const name = "labaCb" + (++jsonpSeq) + "_" + Date.now();
  const script = document.createElement("script");
  let done = false;
  const cleanup = () => {
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(script.parentNode) script.parentNode.removeChild(script);
  };
  window[name] = data => { done = true; cleanup(); if(cb) cb(data); };
  const qs = Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
  script.src = API_URL + "?" + qs + "&callback=" + name;
  script.onerror = () => { if(done) return; done = true; cleanup(); if(fail) fail(); };
  document.body.appendChild(script);
  setTimeout(()=>{ if(!done){ done = true; cleanup(); if(fail) fail(); } }, timeout || 12000);
}

/* ─────────────── ЖЫЛДАР: 2025 — бастапқы деректер, 2026-дан бастап — тоқсандық есептердің жиынтығы ─────────────── */
const YEAR = {base:null, baseYear:DATA.meta.current.year, cur:DATA.meta.current.year, cache:{}, txt:null};
const R4 = ["","I","II","III","IV"];
function applyData(obj){ Object.keys(DATA).forEach(k=>{ delete DATA[k]; }); Object.assign(DATA, JSON.parse(JSON.stringify(obj))); }
/* Кезең белгілері: «Жыл қорытындысы», «2024 / 2025» бағандары — таңдалған жылға сай */
const YEAR_SHIFT = ["vsPrev","h.desc","h.p1.t","s2.p.d","s6.anote","s8.k1s","s8.p4.d","s8.p4.n","s5.note"];
function yearLabels(y, ytd){
  if(!YEAR.txt){ YEAR.txt = {period:TXT.period, y2024:TXT.y2024, y2025:TXT.y2025}; YEAR_SHIFT.forEach(k=>{ YEAR.txt[k] = TXT[k]; }); }
  if(y===YEAR.baseYear){ Object.assign(TXT, YEAR.txt); return; }
  const same = v => ({kk:v, ru:v, en:v});
  TXT.y2024 = same(String(y-1)); TXT.y2025 = same(String(y));
  /* мәтіндегі жылдарды ауыстыру: 2025 → таңдалған жыл, 2024 → алдыңғы жыл */
  YEAR_SHIFT.forEach(k=>{ const o = YEAR.txt[k]; if(!o) return; const n = {};
    Object.keys(o).forEach(l=>{ n[l] = String(o[l]).replace(/2025/g,"\u0001").replace(/2024/g,String(y-1)).replace(/\u0001/g,String(y)); });
    TXT[k] = n; });
  TXT["s5.note"] = {kk:"Көрсеткіш — өңірдегі пайдаланушылар санының халық санына қатынасы (халық саны — "+YEAR.baseYear+" жылғы).",
    ru:"Показатель — отношение числа пользователей к численности населения региона (население — на "+YEAR.baseYear+" год).",
    en:"Indicator: users as a share of the regional population (population as of "+YEAR.baseYear+")."};
  TXT.period = ytd ? {kk:"Жыл басынан (алдын ала)", ru:"С начала года (предв.)", en:"Year to date (preliminary)"} : YEAR.txt.period;
}
function setYear(y){
  if(!YEAR.base) YEAR.base = JSON.parse(JSON.stringify(DATA));
  const done = () => { YEAR.cur = y; ySel.value = y; fillPeriods(); render(location.hash.slice(1)||"home"); };
  if(y===YEAR.baseYear){ applyData(YEAR.base); yearLabels(y); return done(); }
  const go2 = yd => { const D = buildYearData(YEAR.base, yd); applyData(D); yearLabels(y, D.meta.ytd); done(); };
  if(YEAR.cache[y]) return go2(YEAR.cache[y]);
  jsonp({action:"yearData", year:y}, res=>{
    if(!res || !res.ok || !res.total){ ySel.value = YEAR.cur; return; }
    YEAR.cache[y] = res; go2(res);
  }, 25000, ()=>{ ySel.value = YEAR.cur; });
}
/* Тоқсандық есептерде бар жылдарды жыл таңдағышқа қосу */
function loadYears(){
  if(!API_URL) return;
  jsonp({action:"yearData"}, res=>{
    if(!res || !res.ok) return;
    if(res.total) YEAR.cache[res.year] = res;
    (res.years||[]).slice().sort((a,b)=>a-b).forEach(y=>{
      if(y===YEAR.baseYear || [].some.call(ySel.options, o=>+o.value===y)) return;
      ySel.add(new Option(y+" ж.", y), 0);

}
/* Өңір атауы (тізілім) → аналитикадағы атауы */
function yearRegKey(n){
  if(n.indexOf("lib:")===0){
    if(/академиялық/i.test(n)) return "ҚР ҰАК";
    if(/[Зз]ағип|нашар көретін/.test(n)) return "ҚР ЗНКААК";
    return "ҚР ҰК";
  }
  return ({"Алматы қаласы":"Алматы","Астана қаласы":"Астана","Шымкент қаласы":"Шымкент"})[n] ? "city:"+n.split(" ")[0] : n.replace(/ облысы$/,"");
}
function regMatch(name, key){
  if(key.indexOf("city:")===0) return name.indexOf(key.slice(5))===0 && /қ\.|қалалық/.test(name);
  return name===key;
}
const r1 = v => Math.round(v*10)/10;
const pctOf = (a,b) => b ? r1(a/b*100) : 0;
/* 2025 құрылымындағы DATA-ны жылдың жиынтығымен толтыру: есептерде жоқ көрсеткіштер 2025 жылғы күйінде қалады */
function buildYearData(B, yd){
  const D = JSON.parse(JSON.stringify(B)), t = yd.total, s = t.s, y = yd.year;
  const full = t.libs && t.full/t.libs >= 0.9;                      // жылдың есебі толық (90%-дан көп кітапхана 4 тоқсан)
  const P = v => full ? v : null;                                    // алдыңғы жылмен салыстыру — тек толық жылда
  const qn = [1,2,3,4].filter(q=>yd.qs[q]).map(q=>R4[q]);
  D.meta = Object.assign({}, B.meta, {current:{year:y, period:"period"}, ytd:!full, yd:{rep:t.rep, libs:t.libs, full:t.full, q:qn.join(", ")},
    asOf: y + (qn.length ? " · " + qn.join(", ") + " " + (LANG==="ru"?"кв.":LANG==="en"?"Q":"тоқсан") : "")});
  const regs = {};
  (yd.regions||[]).forEach(r=>{ regs[yearRegKey(r.name)] = r; });
  const regOfName = name => { const k = Object.keys(regs).find(k=>regMatch(name,k)); return k ? regs[k] : null; };
  D.totals = {
    libs:{v:t.libs, p:P(B.totals.libs.v), label:B.totals.libs.label}, users:{v:s["6.1"], p:P(B.totals.users.v), label:B.totals.users.label},
    visits:{v:s["6.3"], p:P(B.totals.visits.v), label:B.totals.visits.label}, loans:{v:s["6.2"], p:P(B.totals.loans.v), label:B.totals.loans.label},
    fund:{v:s["4.1"], p:P(B.totals.fund.v), label:B.totals.fund.label}, staff:{v:s["5.3"], p:P(B.totals.staff.v), label:B.totals.staff.label}};
  const adults = Math.max(s["6.1"]-s["6.4"]-s["6.5"], 0), perLib = t.rep ? Math.round(s["6.1"]/t.rep) : 0;
  D.users = Object.assign({}, B.users, {total:s["6.1"], prev:P(B.users.total), children:s["6.4"], childrenPct:pctOf(s["6.4"],s["6.1"]),
    youth:s["6.5"], youthPct:pctOf(s["6.5"],s["6.1"]), adults:adults, adultsPct:pctOf(adults,s["6.1"]), perLib:perLib, perLibDiff:full ? perLib-B.users.perLib : 0});
  D.visits = {total:s["6.3"], internet:s["6.7"], internetPct:pctOf(s["6.7"],s["6.3"])};
  D.loans = {total:s["6.2"], kz:s["6.6"], kzPct:pctOf(s["6.6"],s["6.2"])};
  D.fund = Object.assign({}, B.fund, {total:s["4.1"], kazakh:s["4.5"], kazakhPct:pctOf(s["4.5"],s["4.1"])});
  D.acq = Object.assign({}, B.acq, {total:s["4.6"], kz:s["4.7"], kzPct:pctOf(s["4.7"],s["4.6"]), diff:full ? s["4.6"]-B.acq.total : 0,
    diffKz:full ? s["4.7"]-B.acq.kz : 0, perLib:t.rep ? Math.round(s["4.6"]/t.rep) : 0, perLibKz:t.rep ? Math.round(s["4.7"]/t.rep) : 0,
    byRegion:B.acq.byRegion.map(x=>{ const r = regOfName(x.region); return Object.assign({}, x, {total:r ? r.s["4.6"] : 0}); })});
  D.renewal = Object.assign({}, B.renewal, {fact:pctOf(s["4.6"],s["4.1"]), prev:B.renewal.fact,
    byRegion:B.renewal.byRegion.map(x=>{ const r = regOfName(x.region); return {region:x.region, y2024:x.y2025, y2025:r ? pctOf(r.s["4.6"],r.s["4.1"]) : 0}; })});
  D.supply = Object.assign({}, B.supply, {value:s["6.1"] ? r1(s["4.1"]/s["6.1"]) : 0, prev:B.supply.value,
    byRegion:B.supply.byRegion.map(x=>{ const r = regOfName(x.region); return {region:x.region, y2024:x.y2025, y2025:r && r.s["6.1"] ? r1(r.s["4.1"]/r.s["6.1"]) : 0}; })});
  D.regions = B.regions.map(x=>{ const r = regOfName(x.name);
    return Object.assign({}, x, {libs:r ? r.libs : x.libs, fund:r ? r.s["4.1"] : 0, fundKz:r ? r.s["4.5"] : 0, loans:r ? r.s["6.2"] : 0, loansKz:r ? r.s["6.6"] : 0,
      users:r ? r.s["6.1"] : 0, visits:r ? r.s["6.3"] : 0, staff:r ? r.s["5.3"] : 0,
      p_libs:x.libs, p_fund:x.fund, p_loans:x.loans, p_users:x.users, p_visits:x.visits, p_staff:x.staff}); });
  D.reading = B.reading.map(x=>{ const r = regOfName(x.region); const u = r ? r.s["6.1"] : 0; return Object.assign({}, x, {users:u, pct:pctOf(u,x.pop)}); });
  D.country = Object.assign({}, B.country, {readingPct:pctOf(s["6.1"], B.country.population)});
  D.staff = Object.assign({}, B.staff, {total:s["5.3"], prev:P(B.staff.total), higherLib:s["5.4"], higherPct:pctOf(s["5.4"],s["5.3"]),
    secondary:s["5.5"], secondaryPct:pctOf(s["5.5"],s["5.3"]), noProfPct:s["5.3"] ? r1(100-pctOf(s["5.4"],s["5.3"])-pctOf(s["5.5"],s["5.3"])) : 0});
  D.digital = Object.assign({}, B.digital, {automationCount:t.automation, automationPct:pctOf(t.automation,t.rep), internetPct:pctOf(t.internet,t.rep),
    copies:s["3.12"]});
  D.infra = Object.assign({}, B.infra, {needRepair:t.needRepair, modernized:t.modernized});
  return D;
}
/* 2026-дан кейінгі жылдардағы ескерту: қай тоқсандар, қанша кітапхана, қай көрсеткіштер 2025 жылғы күйінде */
const YEAR_NOCALC = ["method","publish","events","compare"];
function yearBanner(id){
  const m = DATA.meta;
  if(!m.yd || id==="passport") return "";
  const yd = m.yd;
  const kk = YEAR_NOCALC.indexOf(id)>-1
    ? "Бұл бөлімнің деректері тоқсандық есептерден жиналмайды — " + YEAR.baseYear + " жылдың деректері көрсетілген."
    : (m.ytd ? m.current.year + " жыл: " + (yd.q || "—") + " тоқсандардың бекітілген есептері бойынша алдын ала деректер" : m.current.year + " жылдың қорытындысы")
      + " (" + nf(yd.rep) + " / " + nf(yd.libs) + " кітапхана). Тоқсандық есепте жиналмайтын көрсеткіштер (ведомстволар, қор құрамы, жас топтары, АКАЖ түрлері т.б.) " + YEAR.baseYear + " жылғы күйінде.";
  const ru = YEAR_NOCALC.indexOf(id)>-1
    ? "Данные этого раздела не собираются из квартальных отчётов — показаны данные за " + YEAR.baseYear + " год."
    : (m.ytd ? m.current.year + " год: предварительные данные по утверждённым отчётам за " + (yd.q || "—") + " кв." : "Итоги " + m.current.year + " года")
      + " (" + nf(yd.rep) + " / " + nf(yd.libs) + " библиотек). Показатели, не входящие в квартальный отчёт (ведомства, состав фонда, возраст, виды АБИС и др.), — за " + YEAR.baseYear + " год.";
  const en = YEAR_NOCALC.indexOf(id)>-1
    ? "This section is not compiled from quarterly reports — " + YEAR.baseYear + " data are shown."
    : (m.ytd ? m.current.year + ": preliminary data from approved reports for Q " + (yd.q || "—") : m.current.year + " annual results")
      + " (" + nf(yd.rep) + " / " + nf(yd.libs) + " libraries). Indicators not in the quarterly report are shown as of " + YEAR.baseYear + ".";
  return `<div class="year-note">${svg(PI.info)}<span>${esc(LANG==="ru"?ru:LANG==="en"?en:kk)}</span></div>`;
}

const sidebar = document.getElementById("sidebar"), scrim = document.getElementById("scrim");
function closeSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("on"); }
document.getElementById("burger").addEventListener("click",()=>{
  sidebar.classList.toggle("open"); scrim.classList.toggle("on");
});
scrim.addEventListener("click",closeSidebar);

/* ─────────────── КҮН / ТҮН РЕЖИМІ ─────────────── */
function setTheme(t, save){
  document.documentElement.setAttribute("data-theme", t);
  if(save) localStorage_set("laba_theme", t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#0B1120" : "#5170FF");
  chartTheme();
  const y = window.scrollY;
  render(location.hash.slice(1)||"home");
  window.scrollTo(0, y);
}
document.getElementById("themeBtn").addEventListener("click",()=>setTheme(isDark() ? "light" : "dark", true));
/* Пайдаланушы өзі таңдамаса — құрылғының баптауына ілесеміз */
if(window.matchMedia){
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const follow = e => { if(!localStorage_get("laba_theme")) setTheme(e.matches ? "dark" : "light", false); };
  if(mq.addEventListener) mq.addEventListener("change", follow); else if(mq.addListener) mq.addListener(follow);
}

/* ─────────────── ІСКЕ ҚОСУ ─────────────── */
document.documentElement.lang = LANG;
document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===LANG));
buildNav();
fillPeriods();
try{ if(sessionStorage.getItem("laba_tok")) loadCabinet(); }catch(e){}
render(location.hash.slice(1)||"home");
loadRemote();
loadPassports();
loadYears();
</script>
