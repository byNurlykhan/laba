<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABA — Library and Book Analytics</title>
<meta name="description" content="LABA — Қазақстан кітапханаларының статистикасын визуалды түрде ұсынатын аналитикалық медиа-платформа.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:#2563EB;--blue-dark:#1D4ED8;--blue-900:#1E3A8A;
  --ink:#0F172A;--text:#475569;--muted:#64748B;
  --surface:#F8FAFC;--line:#E2E8F0;--green:#16A34A;--red:#DC2626;--amber:#D97706;
  --shadow:0 8px 30px rgba(37,99,235,.08);
  --shadow-mid:0 14px 44px rgba(37,99,235,.12);
  --sidebar:264px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);
  background:var(--surface);line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5{color:var(--ink);font-weight:700;letter-spacing:-.02em;line-height:1.2}
a{color:inherit}
.accent{color:var(--blue)}
::selection{background:#DBEAFE}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:60;
  transition:transform .25s ease;
}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue-900));display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 12px rgba(37,99,235,.28)}
.logo-mark svg{width:19px;height:19px}
.logo-t b{display:block;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.04em;line-height:1.1}
.logo-t span{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px 20px}
.sb-group{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 7px}
.sb-nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  font-size:13.5px;font-weight:500;color:var(--text);text-decoration:none;transition:all .15s ease;
}
.sb-nav a:hover{background:var(--surface);color:var(--ink)}
.sb-nav a.on{background:#EFF6FF;color:var(--blue);font-weight:600;box-shadow:inset 0 0 0 1px rgba(37,99,235,.3)}
.sb-nav a .n{width:20px;flex-shrink:0;font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.sb-nav a.on .n{color:var(--blue)}
.sb-foot{padding:14px 20px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;display:none}
.scrim.on{display:block}

/* ============ MAIN ============ */
.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.burger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;place-items:center;flex-shrink:0}
.burger span{display:block;width:17px;height:2px;background:var(--ink);border-radius:2px;position:relative}
.burger span::before,.burger span::after{content:'';position:absolute;left:0;width:17px;height:2px;background:var(--ink);border-radius:2px}
.burger span::before{top:-5px}.burger span::after{top:5px}
.crumb{font-size:13px;color:var(--muted);font-weight:500;flex:1;min-width:120px}
.crumb b{color:var(--ink);font-weight:600}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.pick{
  font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer;transition:all .2s ease;
}
select.pick:hover{border-color:#CBD5E1}
.langs{display:flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.langs button{
  font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:6px;
  border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;
}
.langs button.on{background:var(--blue);color:#fff}
.content{padding:28px;max-width:1440px;width:100%}

/* ============ PAGE ============ */
.page{display:none;animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{margin-bottom:22px}
.ph .eyebrow{font-size:11.5px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.ph h1{font-size:clamp(24px,3vw,32px)}
.ph h2{font-size:clamp(21px,2.6vw,27px)}
.ph p{margin-top:9px;font-size:15px;max-width:760px}

/* ============ CARDS ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;transition:box-shadow .2s ease,transform .2s ease}
.card.hov:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi .lbl{font-size:12.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.kpi .ic{width:26px;height:26px;border-radius:8px;background:#EFF6FF;display:grid;place-items:center;flex-shrink:0}
.kpi .ic svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .num{font-size:clamp(24px,2.6vw,30px);font-weight:700;color:var(--ink);letter-spacing:-.035em;line-height:1.1}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.delta{font-size:12.5px;font-weight:600;margin-top:5px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}

/* chart panel */
.panel-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-hd h3{font-size:16px;font-weight:600;letter-spacing:-.015em}
.panel-hd p{font-size:12.5px;color:var(--muted);margin-top:3px}
.dl{
  width:31px;height:31px;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--muted);flex-shrink:0;transition:all .2s ease;
}
.dl:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.dl svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbox{position:relative;height:280px}
.cbox.sm{height:210px}
.cbox.lg{height:340px}

/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;max-width:100%}
.tabs button{
  font-family:inherit;font-size:13px;font-weight:500;padding:8px 15px;border-radius:8px;
  border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .18s ease;white-space:nowrap;
}
.tabs button:hover{color:var(--ink);background:var(--surface)}
.tabs button.on{background:var(--blue);color:#fff;font-weight:600}
.tabpane{display:none}.tabpane.on{display:block}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:0 12px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface)}
.tbl td.v{font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.rank{width:38px}
.medal{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:#CBD5E1}
.m1{background:linear-gradient(135deg,#FBBF24,#D97706)}
.m2{background:linear-gradient(135deg,#CBD5E1,#94A3B8)}
.m3{background:linear-gradient(135deg,#FDBA74,#C2410C)}
.scroll-x{overflow-x:auto}

/* bars / progress */
.bar-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.bar-row .nm{font-size:13px;color:var(--text);width:140px;flex-shrink:0}
.bar-track{flex:1;height:9px;background:var(--surface);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:5px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-row .vv{font-size:13px;font-weight:600;color:var(--ink);width:64px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

/* pill / badge */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:#EFF6FF;color:var(--blue)}
.pill.ok{background:#DCFCE7;color:#15803D}
.pill.warn{background:#FEF3C7;color:#B45309}
.pill.bad{background:#FEE2E2;color:#B91C1C}
.pill.gray{background:var(--surface);color:var(--muted)}

/* hero (home) */
.hero{
  background:linear-gradient(135deg,var(--blue),var(--blue-900));border-radius:20px;
  padding:clamp(28px,4vw,44px);color:#fff;margin-bottom:20px;position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.07);top:-140px;right:-90px}
.hero .tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:18px}
.hero h1{color:#fff;font-size:clamp(26px,3.8vw,40px);position:relative}
.hero p{color:rgba(255,255,255,.84);font-size:15.5px;max-width:660px;margin-top:12px;position:relative}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px;position:relative}
.hero-stats div b{display:block;font-size:clamp(20px,2.4vw,26px);font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1.1}
.hero-stats div span{font-size:12px;color:rgba(255,255,255,.72)}

/* section grid (home nav) */
.nav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nav-tile{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
  text-decoration:none;display:flex;flex-direction:column;gap:9px;transition:all .2s ease;cursor:pointer;
}
.nav-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#BFDBFE}
.nav-tile .n{font-size:11px;font-weight:700;color:var(--blue);background:#EFF6FF;width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.nav-tile b{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.3}
.nav-tile span{font-size:12px;color:var(--muted);line-height:1.45}

/* news */
.news-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;transition:all .2s ease}
.news-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.news-date{background:#EFF6FF;color:var(--blue);border-radius:10px;padding:8px 10px;text-align:center;flex-shrink:0;height:fit-content;line-height:1.15}
.news-date b{display:block;font-size:17px;font-weight:700;color:var(--blue)}
.news-date span{font-size:10px;font-weight:600;letter-spacing:.04em}
.news-card h4{font-size:14.5px;font-weight:600;letter-spacing:-.015em;margin-bottom:5px}
.news-card p{font-size:13px;color:var(--text);line-height:1.5}
.news-meta{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-24px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #EFF6FF}
.tl-item b{font-size:14px;font-weight:600;color:var(--ink);display:block}
.tl-item span{font-size:12.5px;color:var(--muted)}

/* gauge / radial */
.radial{display:flex;align-items:center;gap:16px}
.radial svg{width:96px;height:96px;flex-shrink:0}
.radial .rv{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.03em;line-height:1.1}
.radial .rl{font-size:12.5px;color:var(--muted);margin-top:3px}

/* before/after */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ba > div{border-radius:12px;padding:16px;border:1px solid var(--line)}
.ba .before{background:var(--surface)}
.ba .after{background:#EFF6FF;border-color:#BFDBFE}
.ba h5{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.ba .after h5{color:var(--blue)}
.ba b{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.03em;display:block}
.ba span{font-size:12.5px;color:var(--muted)}

.note{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:12px;padding:14px 16px;font-size:13.5px;color:#1E40AF;display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.note svg{width:16px;height:16px;stroke:#1E40AF;fill:none;stroke-width:2;flex-shrink:0;margin-top:3px}
.src{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ============ АВТОРЛЫҚ БЕЛГІ ============ */
.site-foot{
  margin-top:auto;padding:26px 28px 34px;
  display:flex;align-items:center;gap:16px;
}
.site-foot .sf-line{
  flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);
}
.site-foot .sf-mark{
  font-size:11px;font-weight:500;color:var(--muted);
  letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;
}
.site-foot .sf-mark b{font-weight:600;color:var(--ink);letter-spacing:.14em}
@media(max-width:520px){
  .site-foot{padding:22px 16px 28px;gap:10px}
  .site-foot .sf-mark{font-size:9.5px;letter-spacing:.1em}
}

/* ============ RESPONSIVE ============ */
@media(max-width:1200px){
  .g6{grid-template-columns:repeat(3,1fr)}
  .nav-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .g-2-1,.g-1-2{grid-template-columns:1fr}
}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 20px 60px rgba(15,23,42,.2)}
  .main{margin-left:0}
  .burger{display:grid}
  .content{padding:18px}
  .topbar{padding:10px 16px}
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}
  .nav-grid{grid-template-columns:repeat(2,1fr)}
  .hero-stats{grid-template-columns:1fr;gap:14px}
  .ba{grid-template-columns:1fr}
  .bar-row .nm{width:100px}
  .cbox{height:240px}
}
@media(max-width:520px){
  .nav-grid{grid-template-columns:1fr}
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ==================== SIDEBAR ==================== -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">

  <nav class="sb-nav" id="nav"></nav>

  <div class="sb-foot">
    <span data-i18n="owner">ҚР Ұлттық кітапханасы</span><br>
    <span data-i18n="dept">Ғылыми-әдістемелік қызмет</span>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<!-- ==================== MAIN ==================== -->
<div class="main">

      <select class="pick" id="year" aria-label="Жыл"></select>

      <div class="langs">

        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div class="content" id="content"></div>

  <footer class="site-foot">
    <span class="sf-line"></span>
    <span class="sf-mark">Crafted by <b>Nurlykhan Zhumakhan</b></span>

</div>

let LANG = localStorage_get("laba_lang") || "kk";

function localStorage_get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function localStorage_set(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

/* Мәтін алу: T("s3.k1") немесе орын толтырғышпен T("s3.k3s",{a:459}) */
function T(key, vars){
  const row = TXT[key];
  let s = row ? (row[LANG] || row.kk) : key;
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split("{"+k+"}").join(vars[k]); });
  return s;
}
/* Дерек ішіндегі атауды аудару */
function nm(name){
  if(LANG === "kk" || !name) return name;
  const row = NAMES[name];
  if(row && row[LANG]) return row[LANG];
  const clean = String(name).replace(/\n/g," ").trim();
  const row2 = NAMES[clean];
  return (row2 && row2[LANG]) ? row2[LANG] : name;
}

/* ─────────────── КӨМЕКШІЛЕР ─────────────── */
const nf  = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const df  = n => Number(n).toFixed(1).replace(".", LANG==="en" ? "." : ",");
const pf  = n => df(n)+"%";
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chg = (v,p) => (p===null||p===undefined||!p) ? null : (v-p)/p*100;

function deltaHtml(d,extra){
  if(d===null||d===undefined) return "";
  const cls = d>0?"up":(d<0?"down":"flat");
  const ar  = d>0?"▲":(d<0?"▼":"—");
  return `<div class="delta ${cls}">${ar} ${df(Math.abs(d))}%
    <span style="color:var(--muted);font-weight:500">${extra||T("vsPrev")}</span></div>`;
}
const ICONS = {
  book:'<path d="M4 5h7v15H4zM13 5h7v15h-7z"/>',
  users:'<path d="M12 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM4 20a8 8 0 0116 0"/>',
  down:'<path d="M12 4v12M6 11l6 6 6-6M4 20h16"/>',
  chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 000 18 14 14 0 000-18z"/>',
  doc:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>',
  home:'<path d="M4 10l8-6 8 6v10H4z"/>'
};
function kpi(label, value, o){
  o = o || {};
  const fmt = o.fmt || "int";
  const v = fmt==="int" ? nf(value) : (fmt==="pct" ? pf(value) : df(value));
  return `<div class="card kpi hov">
    <div class="lbl"><span>${esc(label)}</span>
      <span class="ic"><svg viewBox="0 0 24 24">${ICONS[o.icon||"chart"]}</svg></span></div>
    <div class="num">${v}</div>
    ${o.sub?`<div class="sub">${esc(o.sub)}</div>`:""}
    ${deltaHtml(o.delta, o.deltaLabel)}</div>`;
}
function panel(id, title, desc, body){
  return `<div class="card">
    <div class="panel-hd">
      <div><h3>${esc(title)}</h3>${desc?`<p>${esc(desc)}</p>`:""}</div>
      ${id?`<button class="dl" data-dl="${id}" title="${T("download")}" aria-label="${T("download")}">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>`:""}
    </div>${body}</div>`;
}
const cv = (id,size) => `<div class="cbox ${size||""}"><canvas id="${id}"></canvas></div>`;

function barList(rows, fmtv){
  const m = Math.max.apply(null, rows.map(r=>r.value));
  return rows.map(r=>`<div class="bar-row">
    <span class="nm">${esc(r.name)}</span>
    <span class="bar-track"><span class="bar-fill" data-w="${(r.value/m*100).toFixed(1)}"></span></span>
    <span class="vv">${(fmtv||nf)(r.value)}</span></div>`).join("");
}
function radial(pct,label,color){
  const r=42, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<div class="radial">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="10"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color||"#2563EB"}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        transform="rotate(-90 50 50)"/></svg>
    <div><div class="rv">${df(pct)}%</div><div class="rl">${esc(label)}</div></div></div>`;
}
function note(html){
  return `<div class="note"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/>
    <path d="M12 8v5M12 16h.01"/></svg><span>${html}</span></div>`;
}
function head(title, desc){
  return `<div class="ph"><div class="eyebrow">${DATA.meta.current.year} · ${esc(T("period"))}</div>
    <h1>${esc(title)}</h1><p>${esc(desc)}</p></div>`;
}
const srcLine = () => `<div class="src">${T("source")}: ${esc(T("sourceFull"))} · ${T("asOf")}: ${DATA.meta.asOf}</div>`;

const GRID = {grid:{color:"#F1F5F9",drawTicks:false},border:{display:false},ticks:{padding:8}};

function mk(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
const hbar = (labels,data,color) => ({
  type:"bar",
  data:{labels:labels,datasets:[{data:data,backgroundColor:color||"#2563EB",borderRadius:5,barThickness:13}]},
  options:{indexAxis:"y",maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:GRID,y:NOGRID}}
});
const donut = (labels,data,suffix) => ({
  type:"doughnut",
  data:{labels:labels,datasets:[{data:data,backgroundColor:PALETTE,borderWidth:0}]},
  options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom"},
    tooltip:{callbacks:{label:c=>" "+(suffix==="%"?df(c.raw)+"%":nf(c.raw))}}}}
});

function ev(x, field){
  const k = field + "_" + LANG;
  return x[k] || x[field] || "";
}
function eventCard(n){
  const link = n.link && n.link !== "#"
    ? `<a href="${esc(n.link)}" target="_blank" rel="noopener"
         style="font-size:12px;font-weight:600;color:var(--blue);text-decoration:none">${T("s14.more")} →</a>` : "";
  return `<article class="news-card">
    <div class="news-date"><b>${esc(n.d)}</b><span>${esc(nm(n.m))}</span></div>
    <div><h4>${esc(ev(n,"title"))}</h4><p>${esc(ev(n,"desc"))}</p>
      <div class="news-meta"><span class="pill">${esc(nm(ev(n,"type")))}</span>${link}</div></div></article>`;
}

  ${head(T("s14"),T("s14.desc"))}

    ? `<div class="grid g2">${DATA.events.map(eventCard).join("")}</div>`

  ${srcLine()}`;

/* ─────────────── APPS SCRIPT БАЙЛАНЫСЫ ─────────────── */
let jsonpSeq = 0;
function jsonp(params, cb, timeout){
  if(!API_URL) return;
  const name = "labaCb" + (++jsonpSeq) + "_" + Date.now();
  const script = document.createElement("script");
  let done = false;
  const cleanup = () => {
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(script.parentNode) script.parentNode.removeChild(script);
  };
  window[name] = data => { done = true; cleanup(); if(cb) cb(data); };
  const qs = Object.keys(params).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
  script.src = API_URL + "?" + qs + "&callback=" + name;
  script.onerror = () => { cleanup(); };
  document.body.appendChild(script);
  setTimeout(()=>{ if(!done) cleanup(); }, timeout || 12000);
}

/* Барлық деректі Google Sheets-тен жаңарту */
function loadRemote(){
  jsonp({action:"data"}, res=>{
    if(!res || !res.ok) return;
    if(res.txt)   Object.keys(res.txt).forEach(k=>{ TXT[k] = Object.assign(TXT[k]||{}, res.txt[k]); });
    if(res.names) Object.keys(res.names).forEach(k=>{ NAMES[k] = Object.assign(NAMES[k]||{}, res.names[k]); });
    if(res.data)  Object.keys(res.data).forEach(k=>{ DATA[k] = res.data[k]; });
    buildNav();
    render(location.hash.slice(1) || "home");
  });
}
/* Қолданушы статистикасын жіберу */
let lastHit = "";
function track(page){
  if(!TRACK || !API_URL) return;
  const key = page + "|" + LANG;
  if(key === lastHit) return;
  lastHit = key;
  jsonp({action:"hit", page:page, lang:LANG,
         ref:(document.referrer||"").slice(0,180),
         w:window.innerWidth||0, tz:(new Date()).getTimezoneOffset()}, null, 8000);
}

/* ─────────────── РОУТЕР ─────────────── */
function buildNav(){
  const nav = document.getElementById("nav");
  let html = "", lastGroup = "";
  SECTIONS.forEach((s,i)=>{
    if(s.group!==lastGroup){ html += `<div class="sb-group">${T(s.group)}</div>`; lastGroup = s.group; }
    html += `<a href="#${s.id}" data-id="${s.id}"><span class="n">${i+1}</span>${T(s.key)}</a>`;
  });
  nav.innerHTML = html;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent = T(el.dataset.i18n));
}
function render(id){
  const sec = SECTIONS.find(s=>s.id===id) || SECTIONS[0];
  Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]});
  document.getElementById("content").innerHTML = `<div class="page on">${P[sec.id]()}</div>`;
  document.getElementById("crumb").textContent = T(sec.key);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===sec.id));
  document.title = T(sec.key)+" · LABA";
  if(P[sec.id].charts) P[sec.id].charts();
  requestAnimationFrame(()=>document.querySelectorAll(".bar-fill").forEach(b=>b.style.width=b.dataset.w+"%"));
  window.scrollTo(0,0);
  closeSidebar();
  track(sec.id);
}
const go = id => { location.hash = id; };
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"home"));

document.addEventListener("click",e=>{
  const dl = e.target.closest("[data-dl]");
  if(dl){
    const ch = charts[dl.dataset.dl];
    if(!ch) return;
    const a = document.createElement("a");
    a.href = ch.toBase64Image("image/png",1);
    a.download = "laba-"+dl.dataset.dl+".png";
    a.click();
    return;
  }
  const tile = e.target.closest("[data-go]");
  if(tile){ go(tile.dataset.go); return; }
  const tab = e.target.closest(".tabs button");
  if(tab){
    tab.closest(".tabs").querySelectorAll("button").forEach(b=>b.classList.remove("on"));
    tab.classList.add("on");
    document.querySelectorAll(".tabpane").forEach(p=>p.classList.remove("on"));
    const pane = document.getElementById(tab.dataset.tab);
    if(pane){
      pane.classList.add("on");
      Object.values(charts).forEach(c=>c.resize());
      requestAnimationFrame(()=>pane.querySelectorAll(".bar-fill").forEach(b=>b.style.width=b.dataset.w+"%"));
    }
  }
});

document.querySelectorAll(".langs button").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".langs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    LANG = b.dataset.lang;
    localStorage_set("laba_lang", LANG);
    document.documentElement.lang = LANG;
    buildNav();
    render(location.hash.slice(1)||"home");
  });
});

const ySel = document.getElementById("year"), qSel = document.getElementById("quarter");
DATA.meta.years.forEach(y=>ySel.add(new Option(y+" ж.",y)));
function fillPeriods(){
  qSel.innerHTML = "";
  DATA.meta.periods.forEach(k=>qSel.add(new Option(T(k),k)));
  qSel.value = DATA.meta.current.period;
}
ySel.value = DATA.meta.current.year;
ySel.addEventListener("change",()=>{
  DATA.meta.current.year = +ySel.value;
  render(location.hash.slice(1)||"home");
});

const sidebar = document.getElementById("sidebar"), scrim = document.getElementById("scrim");
function closeSidebar(){ sidebar.classList.remove("open"); scrim.classList.remove("on"); }
document.getElementById("burger").addEventListener("click",()=>{
  sidebar.classList.toggle("open"); scrim.classList.toggle("on");
});
scrim.addEventListener("click",closeSidebar);

/* ─────────────── ІСКЕ ҚОСУ ─────────────── */
document.documentElement.lang = LANG;
document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===LANG));
buildNav();
fillPeriods();
render(location.hash.slice(1)||"home");
loadRemote();
